<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploding Heart</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap');
    
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      overflow: hidden;
      flex-direction: column;
      font-family: "Ubuntu", serif; /* Apply the font globally */
    }

    .heart {
      position: relative;
      width: 200px; /* Double size */
      height: 200px; /* Double size */
      background-color: red;
      transform: rotate(-45deg);
      margin-top: 50px;
      cursor: pointer;
      animation: heartbeat 0.8s infinite; /* Faster animation */
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 200px; /* Double size */
      height: 200px; /* Double size */
      background-color: red;
      border-radius: 50%;
      top: -100px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: 100px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1) rotate(-45deg);
      }
      50% {
        transform: scale(1.3) rotate(-45deg); /* Bigger zoom */
      }
    }

    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: red;
      border-radius: 50%;
      animation: explode 1s forwards;
    }

    @keyframes explode {
      0% {
        transform: scale(1) translate(0, 0);
        opacity: 1;
      }
      100% {
        transform: scale(0.5) translate(calc(var(--dx) * 400px), calc(var(--dy) * 400px)); /* Adjust explosion for larger heart */
        opacity: 0;
      }
    }

    .message {
      display: none;
      font-size: 70px; /* Increase text size */
      color: red;
      margin-top: 20px;
      font-family: "Ubuntu", serif; /* Apply the font to the message */
    }
  </style>
</head>
<body>
  <div class="heart" id="heart"></div>
  <div class="message" id="message">I Love You Samiya</div>

  <script>
    const heart = document.getElementById("heart");
    const message = document.getElementById("message");

    heart.addEventListener("click", () => {
      const particles = 20; // Number of particles
      for (let i = 0; i < particles; i++) {
        const particle = document.createElement("div");
        particle.classList.add("particle");
        document.body.appendChild(particle);

        // Random direction for particles
        const angle = Math.random() * 2 * Math.PI;
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);

        // Set direction variables for CSS
        particle.style.setProperty("--dx", dx);
        particle.style.setProperty("--dy", dy);

        // Position particles at heart's center
        const rect = heart.getBoundingClientRect();
        particle.style.left = `${rect.left + rect.width / 2}px`;
        particle.style.top = `${rect.top + rect.height / 2}px`;

        // Remove particles after animation
        particle.addEventListener("animationend", () => {
          particle.remove();
        });
      }

      // Hide the heart after explosion
      heart.style.display = "none";

      // Show the message
      message.style.display = "block";
    });
  </script>
</body>
</html>
